<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Todo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .5rem; }
    button { padding: .5rem .8rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #ddd; }
    li span { flex: 1; cursor: pointer; }
    li.done span { text-decoration: line-through; opacity: .5; }
  </style>
</head>
<body>
  <h1>Quick Todo</h1>
  <form id="form">
    <input id="title" placeholder="New task…" autocomplete="off">
    <button>Add</button>
  </form>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById("list");
    const form = document.getElementById("form");
    const input = document.getElementById("title");

    async function load() {
      const todos = await (await fetch("/api/todos")).json();
      list.innerHTML = "";
      for (const t of todos) {
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        const span = document.createElement("span");
        span.textContent = t.title;
        span.onclick = async () => { await fetch("/api/todos/" + t.id, { method: "PATCH" }); load(); };
        const del = document.createElement("button");
        del.textContent = "✕";
        del.onclick = async () => { await fetch("/api/todos/" + t.id, { method: "DELETE" }); load(); };
        li.append(span, del);
        list.append(li);
      }
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      if (!input.value.trim()) return;
      await fetch("/api/todos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: input.value })
      });
      input.value = "";
      load();
    };

    load();
  </script>
</body>
</html>
