services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: boblareleve
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  back:
    build: ./back
    environment:
      DATABASE_URL: postgres://user:password@db:5432/mydb
    ports:
      - "3000:3000"
    depends_on:
      - db

  front:
    build: ./front
    ports:
      - "8080:80"
    depends_on:
      - back

volumes:
  pgdata:
