name: CI Pipeline

on:
  push:
    branches: [ "dev", "val", "prod" ]
  pull_request:
    branches: [ "dev", "val", "prod" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que Docker Compose se lance bien et que tout build
        run: |
          docker compose -f docker-compose-build.yml up --build